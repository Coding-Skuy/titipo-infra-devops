# TTP-OPS-003: nol secret di repo. Memindai berkas terlacak + menjalankan uji skrip rahasia.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pindai berkas terlacak
        run: bash scripts/secrets/scan-repo.sh .
      - name: Uji skrip pemindai
        run: |
          for t in scripts/secrets/tests/test-*.sh; do echo "== $t"; bash "$t"; done
